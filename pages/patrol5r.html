<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patrol 5R & K3</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/dark.css">
</head>
<body>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div id="v"></div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/xlsx-lite.js"></script>
  <script src="../js/report.js"></script>
  <script>
    guard();
    let db = load();
    topbar(`${ico('broom')} Patrol 5R & K3`, true);

    const T = {
      dash: 'Dashboard',
      new: 'Input Patroli',
      hist: 'Riwayat',
      find: 'Temuan',
      jad: 'Jadwal Patroli',
      rule: 'Ketentuan Penilaian',
      form: 'Kelola Form'
    };

    const months = () => [...new Set(db.p5.map(x => x.date.slice(0, 7)))].sort();
    let tab = 'dash', month = '', dept = DEPTS[0];

    const rAvg = (x, r) => mean(x.sc[r] || []),
          allAvg = x => mean(R5.flatMap(r => x.sc[r] || []));

    const cc = v => 'c' + Math.max(1, Math.min(5, Math.round(v))),
          f1 = v => v == null ? '-' : v.toFixed(1);

    function go(t) {
      tab = t;
      tabs.innerHTML = Object.keys(T).filter(k => k !== 'form' || isAdmin()).map(k => `<button class="${k === t ? 'on' : ''}" onclick="go('${k}')">${T[k]}</button>`).join('');
      if (t === 'form' && !isAdmin()) t = 'dash';
      ({ dash, new: inp, hist, find, jad, rule, form: kform })[t]();
    }

    function rows(arr) {
      const v = R5.map(r => mean(arr.map(x => rAvg(x, r)).filter(z => z != null)) || null);
      return [...v, mean(v.filter(z => z != null))];
    }

    // ---------- dashboard (default: semua periode)
    function dash() {
      const L = db.p5.filter(x => !month || x.date.slice(0, 7) === month),
            tms = L.flatMap(x => x.tm),
            cl = tms.filter(t => t.status === 'closed').length;

      const D = DEPTS.map(d => rows(L.filter(x => AR(x.bag).d === d))),
            cats = [...R5, 'RATA-RATA'],
            ov = mean(L.map(allAvg));

      const bgs = AREAS.filter(a => a.d === dept && L.some(x => x.bag === a.id)),
            bgS = bgs.map(a => ({ name: a.b, color: bcol(a.b), values: rows(L.filter(x => x.bag === a.id)).slice(0, 6) }));

      const per = month ? ML(month) : 'Semua periode';

      v.innerHTML = `
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
          <label style="margin:0;font-weight:600">Periode</label>
          <select style="width:200px;" onchange="month=this.value;dash()">
            <option value="">Semua periode</option>
            ${months().map(m => `<option value="${m}" ${m === month ? 'selected' : ''}>${ML(m)}</option>`).join('')}
          </select>
          <span style="margin-left:auto;display:flex;gap:8px"><button class="btn g s" onclick="openExport('excel',db.p5)">${ico('download')} Excel</button><button class="btn g s" onclick="openExport('pdf',db.p5)">${ico('printer')} PDF</button></span>
        </div>
        
        <div class="grid g5" style="margin-bottom:14px">
          <div class="card kpi"><b>${L.length}</b><span>Patroli dilakukan</span></div>
          <div class="card kpi"><b>${f1(ov)}</b><span>Nilai rata-rata · ${ov ? kat(ov) : '-'}</span></div>
          <div class="card kpi"><b>${tms.length}</b><span>Total temuan</span></div>
          <div class="card kpi"><b>${tms.length ? Math.round(cl / tms.length * 100) : 0}%</b><span>Follow-up selesai (${cl}/${tms.length})</span></div>
          <div class="card kpi"><b style="color:var(--bad, #d9534f)">${tms.filter(od).length}</b><span>Temuan overdue</span></div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 14px 0;font-size:14px;font-weight:700">Nilai 5R & K3 per Departemen — ${per}</h3>
          <div class="chart-container">
            ${vbar(R5, DEPTS.map((d, i) => ({ name: d, color: DCOL[d], values: D[i].slice(0, 6) })))}
          </div>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
            <h3 style="margin:0;font-size:14px;font-weight:700">Nilai per Bagian — ${per}</h3>
            <select style="width:220px;" onchange="dept=this.value;dash()">${deptOpts(dept)}</select>
          </div>
          <div class="chart-container">
            ${bgs.length ? vbar(R5, bgS) : '<div class="empty-chart-placeholder">Belum ada data patroli untuk departemen ini</div>'}
          </div>
        </div>

        <div class="grid g2">
          <div class="card">
            <h3 style="margin:0 0 12px 0;font-size:14px;font-weight:700">Tabel nilai per Departemen</h3>
            <div class="tw">
              <table>
                <tr>
                  <th>No</th>
                  <th>Kriteria</th>
                  ${DEPTS.map(d => `<th><i class="dot" style="background:${DCOL[d]}"></i>${d}</th>`).join('')}
                  <th>AVG</th>
                </tr>
                ${cats.map((c, i) => {
                  const vs = D.map(d => d[i]);
                  return `<tr style="${i == 6 ? 'font-weight:700' : ''}">
                    <td>${i < 6 ? i + 1 : ''}</td>
                    <td>${c}</td>${vs.map(z => `<td>${f1(z)}</td>`).join('')}
                    <td><b>${f1(mean(vs.filter(z => z != null)))}</b></td>
                  </tr>`;
                }).join('')}
              </table>
            </div>
          </div>
          <div class="card">
            <h3 style="margin:0 0 12px 0;font-size:14px;font-weight:700">Temuan & Follow-up per Departemen</h3>
            <div class="tw">
              <table>
                <tr>
                  <th>Departemen</th>
                  <th>Temuan</th>
                  <th>Closed</th>
                  <th>%</th>
                  <th>Overdue</th>
                </tr>
                ${DEPTS.map(d => {
                  const t = L.filter(x => AR(x.bag).d === d).flatMap(x => x.tm),
                        c = t.filter(z => z.status === 'closed').length;
                  return `<tr>
                    <td><i class="dot" style="background:${DCOL[d]}"></i>${d}</td>
                    <td>${t.length}</td>
                    <td>${c}</td>
                    <td>${t.length ? Math.round(c / t.length * 100) + '%' : '-'}</td>
                    <td class="${t.some(od) ? 'late' : ''}">${t.filter(od).length}</td>
                  </tr>`;
                }).join('')}
              </table>
            </div>
          </div>
        </div>`;
    }

    // ---------- input patroli: Departemen > Bagian > Form (otomatis)
    let dr = null;
    const FN = { umum: 'Umum (Produksi)', putty: 'Putty / Dempul', fiber: 'Fiber', gudang: 'Gudang', office: 'Office' },
          itm = id => itemsOf(dr.form).find(i => i.id === id);

    const lowFn = v => v <= 3,
          grpOf = id => itm(id).r,
          qText = id => itm(id).t;

    function setLoc(d, b) {
      const nf = AR(b).f;
      if (nf !== dr.form && Object.keys(dr.sc).length && !confirm('Form penilaian untuk bagian ini berbeda. Nilai yang sudah diisi akan direset. Lanjut?')) {
        inp();
        return;
      }
      if (nf !== dr.form) {
        dr.sc = {};
        dr.tm = [];
      }
      dr.dept = d;
      dr.bag = b;
      dr.form = nf;
      inp();
    }

    function inp() {
      if (!dr) {
        const a = AREAS[0];
        dr = { date: today(), dept: a.d, bag: a.id, form: a.f, tim: 'A', sc: {}, tm: [] };
      }
      const its = itemsOf(dr.form);

      v.innerHTML = `
        <div class="card">
          <div class="grid g4">
            <div><label>Departemen</label><select onchange="setLoc(this.value,AREAS.find(a=>a.d===this.value).id)">${deptOpts(dr.dept)}</select></div>
            <div><label>Bagian</label><select onchange="setLoc(AR(this.value).d,this.value)">${bagOpts(dr.dept,dr.bag)}</select></div>
            <div><label>Tanggal</label><input type="date" value="${dr.date}" onchange="dr.date=this.value"></div>
            <div><label>Tim</label><select onchange="dr.tim=this.value">${TIMS.map(t => `<option ${t === dr.tim ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
          </div>
          <p style="margin:14px 0 0">Form penilaian: <span class="chip">${FN[dr.form]}</span> <span style="color:var(--mut);font-size:12.5px">otomatis mengikuti bagian · Inspektur: <b>${me().nama}</b></span></p>
          <p style="margin:6px 0 0;font-size:12px;color:var(--mut)">Skala: ${SCL.map((s, i) => `<b>${i + 1}</b>${s}`).join(' · ')} — nilai ≤3 wajib disertai temuan berfoto.</p>
        </div>
        <div class="sumbar" id="sum"></div>` +
        R5.map((r, ri) => `<div class="card"><h3 style="display:flex;justify-content:space-between"><span>${ri + 1}. ${r}</span><span id="ra_${r}"></span></h3>${its.filter(i => i.r === r).map((i, k) => qrow(i.id, 'abcde'[k] + '.', i.t, '5')).join('')}</div>`).join('') +
        `<button class="btn" onclick="sv()">Simpan patroli</button>`;

      its.forEach(i => tmq(i.id));
      sum();
    }

    function scores() {
      const sc = {};
      let miss = null;
      itemsOf(dr.form).forEach(i => {
        const n = dr.sc[i.id];
        if (n == null) miss = miss || i;
        else (sc[i.r] = sc[i.r] || []).push(n);
      });
      return { sc, miss };
    }

    function sum() {
      const { sc } = scores(),
            a = mean(R5.flatMap(r => sc[r] || []));

      R5.forEach(r => {
        const e = document.getElementById('ra_' + r),
              m = mean(sc[r] || []);
        if (e) e.innerHTML = m != null ? `<span class="chip ${cc(m)}">${m.toFixed(1)}</span>` : '';
      });

      document.getElementById('sum').innerHTML = `
        <span>Nilai akhir</span><b>${a != null ? (Math.round(a * 10) / 10).toFixed(1) : '-'}</b>
        ${a != null ? `<span class="chip">${kat(a)}</span>` : ''}
        <span style="margin-left:auto;opacity:.8;font-size:12px">${R5.map(r => r + ' ' + f1(mean(sc[r] || []))).join(' · ')}</span>`;
    }

    function sv() {
      const { sc, miss } = scores();
      if (miss) return alert('Belum dinilai:\n' + miss.t);
      const e = chkTm(itemsOf(dr.form).map(i => i.id), id => id);
      if (e) return alert(e);
      db.p5.push({ id: uid(), date: dr.date, bag: dr.bag, form: dr.form, tim: dr.tim, by: me().nama, sc, tm: packTm() });
      if (!save(db)) {
        db.p5.pop();
        return;
      }
      dr = null;
      alert('Patroli tersimpan');
      go('dash');
    }

    // ---------- riwayat
    let hf = { from: '', to: '', dept: '', bag: '' };

    function hist() {
      const L = db.p5.filter(x => fmatch(hf, x)).sort((a, b) => b.date.localeCompare(a.date));
      v.innerHTML = fbar(hf, 'hf', 'hist()', { dates: true }) + `
        <div class="card tw">
          <div style="color:var(--mut);margin-bottom:8px">${L.length} patroli</div>
          <table>
            <tr>
              <th>Tanggal</th><th>Departemen</th><th>Bagian</th><th>Form</th><th>Tim</th>
              ${R5.map(r => `<th>${r}</th>`).join('')}
              <th>Nilai</th><th>Temuan</th><th></th>
            </tr>
            ${L.map(x => {
              const a = allAvg(x), g = AR(x.bag);
              return `<tr>
                <td>${x.date}</td><td>${g.d}</td><td>${g.b}</td><td>${FN[x.form]}</td><td>${x.tim}</td>${R5.map(r => `<td>${f1(rAvg(x, r))}</td>`).join('')}
                <td><span class="chip ${cc(a)}">${f1(a)} ·${kat(a)}</span></td>
                <td>${x.tm.length}</td>
                <td>${isAdmin() ? `<button class="btn r s" onclick="del('${x.id}')">Hapus</button>` : ''}</td>
              </tr>`;
            }).join('') || '<tr><td colspan=14>Tidak ada data</td></tr>'}
          </table>
        </div>`;
    }

    function del(id) {
      if (!isAdmin()) return;
      if (confirm('Hapus patroli ini beserta temuannya?')) {
        db.p5 = db.p5.filter(x => x.id !== id);
        save(db);
        hist();
      }
    }

    // ---------- temuan
    function find() {
      temuanTab({ el: v, get: () => db.p5.flatMap(x => x.tm.map(t => ({ x, t }))), grp: '5R', save: () => save(db), redo: find });
    }

    // ---------- jadwal patroli tahunan (admin dapat mengubah tahun & personil)
    let jy = '', jedit = false;

    function jad() {
      db.jadwal = db.jadwal || {};
      const ys = Object.keys(db.jadwal).sort();
      if (!db.jadwal[jy]) jy = ys[ys.length - 1] || String(new Date().getFullYear());
      const rows = db.jadwal[jy] || [],
            adm = isAdmin();

      v.innerHTML = `
        <div class="card">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
            <label style="margin:0">Tahun</label>
            <select style="width:120px" onchange="jy=this.value;jedit=false;jad()">${ys.map(y => `<option ${y === jy ? 'selected' : ''}>${y}</option>`).join('')}</select>
            ${adm ? `<span style="margin-left:auto;display:flex;gap:8px">${jedit ? `<button class="btn g s" onclick="jaddRow()">${ico('plus')} Baris</button><button class="btn g" onclick="db=load();jedit=false;jad()">Batal</button><button class="btn" onclick="save(db);jedit=false;jad()">Simpan</button>` : `<button class="btn g s" onclick="jnew()">${ico('plus')} Tahun baru</button><button class="btn" onclick="jedit=true;jad()">${ico('pencil')} Edit jadwal</button>`}</span>` : ''}
          </div>
          <h3 style="text-align:center;margin:6px 0 16px;letter-spacing:.4px">JADWAL PELAKSANAAN PATROLI 5RK3 TAHUN ${jy}</h3>
          <div class="tw">
            <table class="jt">
              <tr>
                <th style="width:50px">NO</th>
                ${TIMS.map(t => `<th>TEAM ${t}</th>`).join('')}
                ${jedit ? '<th></th>' : ''}
              </tr>
              ${rows.map((r, i) => `<tr>
                <td>${i + 1}</td>${TIMS.map(t => `<td>${jedit ? `<input value="${esc(r[t].n)}" placeholder="Nama" oninput="db.jadwal[jy][${i}].${t}.n=this.value"><input value="${esc(r[t].j)}" placeholder="Jabatan" oninput="db.jadwal[jy][${i}].${t}.j=this.value">` : `<b>${esc(r[t].n)}</b>${esc(r[t].j)}`}</td>`).join('')}
                ${jedit ? `<td><button class="btn r s ib" onclick="jdel(${i})" title="Hapus">${ico('x')}</button></td>` : ''}
              </tr>`).join('')}
            </table>
          </div>
        </div>`;
    }

    function jaddRow() {
      db.jadwal[jy].push(Object.fromEntries(TIMS.map(t => [t, { n: '', j: 'SPV. ' }])));
      jad();
    }

    function jdel(i) {
      db.jadwal[jy].splice(i, 1);
      jad();
    }

    function jnew() {
      const y = prompt('Tahun baru (jadwal disalin dari tahun ' + jy + ', lalu bisa diubah):', String(+jy + 1));
      if (!y) return;
      if (!/^\d{4}$/.test(y)) return alert('Format tahun tidak valid');
      if (db.jadwal[y]) return alert('Jadwal tahun ' + y + ' sudah ada');
      db.jadwal[y] = JSON.parse(JSON.stringify(db.jadwal[jy]));
      save(db);
      jy = y;
      jedit = true;
      jad();
    }

    // ---------- kelola isi form penilaian (khusus admin)
    let ek = 'umum', eg = null;
    const clone = o => JSON.parse(JSON.stringify(o));
    const dirty = () => eg && JSON.stringify(eg) !== JSON.stringify(TPL[ek].g);
    function kform() {
      if (!isAdmin()) return go('dash');
      if (!eg) eg = clone(TPL[ek].g);
      v.innerHTML = `<div class="card"><label style="margin-top:0">Pilih form penilaian yang diedit</label>
        <div class="seg">${Object.keys(TPL).map(k => `<button class="${k === ek ? 'on' : ''}" onclick="kpick('${k}')">${FN[k]}<small>${AREAS.filter(a => a.f === k).length} bagian</small></button>`).join('')}</div>
        <p style="margin:10px 0 0;color:var(--mut);font-size:12.5px">Dipakai oleh: ${AREAS.filter(a => a.f === ek).map(a => a.d + ' › ' + a.b).join(', ')}</p>
        <p style="margin:6px 0 0;color:var(--mut);font-size:12.5px">Ubah, tambah, hapus, atau urutkan pernyataan di tiap kategori. Perubahan berlaku untuk patroli berikutnya; riwayat lama tidak berubah. Enam kategori (Ringkas–K3) tetap, minimal 1 pertanyaan per kategori.</p></div>`
        + R5.map((r, ri) => `<div class="card"><h3>${ri + 1}. ${r}</h3>${eg[r].map((t, i) => `<div class="row"><span class="tg">${'abcdefghijklmnop'[i] || i + 1}.</span><input value="${esc(t)}" oninput="eg['${r}'][${i}]=this.value"><button class="btn g s ib" onclick="kmv('${r}',${i},-1)" title="Naik">${ico('arrow-up')}</button><button class="btn g s ib" onclick="kmv('${r}',${i},1)" title="Turun">${ico('arrow-down')}</button><button class="btn r s ib" onclick="kdel('${r}',${i})" title="Hapus">${ico('x')}</button></div>`).join('')}<button class="btn g s" onclick="eg['${r}'].push('');kform()">${ico('plus')} Pertanyaan</button></div>`).join('')
        + `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="ksave()">Simpan perubahan</button><button class="btn g" onclick="eg=null;kform()">Batalkan perubahan</button><button class="btn g" onclick="kreset()">Kembalikan ke standar</button></div>`;
    }
    function kpick(k) { if (dirty() && !confirm('Perubahan belum disimpan akan hilang. Lanjut?')) return; ek = k; eg = null; kform(); }
    function kmv(r, i, d) { const a = eg[r], j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; kform(); }
    function kdel(r, i) { if (eg[r].length <= 1) return alert('Minimal 1 pertanyaan per kategori'); eg[r].splice(i, 1); kform(); }
    function ksave() {
      const g = {};
      for (const r of R5) { g[r] = eg[r].map(t => t.trim()).filter(Boolean); if (!g[r].length) return alert('Kategori ' + r + ' harus punya minimal 1 pertanyaan'); }
      db.tpl = db.tpl || {}; db.tpl[ek] = g; TPL[ek].g = clone(g);
      if (!save(db)) return;
      dr = null; eg = null; alert('Form ' + FN[ek] + ' tersimpan. Berlaku untuk patroli berikutnya.'); kform();
    }
    function kreset() {
      if (!confirm('Kembalikan form ' + FN[ek] + ' ke pertanyaan standar? Perubahan Anda akan dihapus.')) return;
      if (db.tpl) delete db.tpl[ek]; TPL[ek].g = clone(TPL0[ek].g); save(db); dr = null; eg = null; kform();
    }

    // ---------- ketentuan
    function rule() {
      const tb = (h, rs) => `<table style="max-width:560px"><tr>${h.map(z => `<th>${z}</th>`).join('')}</tr>${rs.map(r => `<tr>${r.map(z => `<td>${z}</td>`).join('')}</tr>`).join('')}</table>`;

      v.innerHTML = `
        <div class="card">
          <h3>A. Ketentuan umum</h3>
          <ol style="margin:0;padding-left:20px;line-height:1.9">
            <li>Penilaian berdasarkan 15 poin pemeriksaan pada Form Penilaian 5R K3.</li>
            <li>Pemeriksaan dilakukan pada area fokus sesuai jadwal pemantauan.</li>
            <li>RINGKAS menggunakan jumlah temuan sesuai standar yang ditetapkan.</li>
            <li>RAPI, RESIK, RAWAT, RAJIN, dan K3 dinilai berdasarkan persentase pemenuhan kondisi yang relevan.</li>
            <li>Nilai akhir = rata-rata 15 poin penilaian, dibulatkan 1 angka di belakang koma.</li>
          </ol>
          <p style="color:var(--mut)">Di aplikasi, inspektur langsung memilih nilai 1–5 pada tiap butir dengan berpedoman pada standar di bawah ini.</p>
        </div>
        <div class="grid g2">
          <div class="card">
            <h3>B1. RINGKAS — jumlah temuan</h3>
            ${tb(['Nilai', 'Jumlah temuan', 'Kategori'], [[5, '0–2', 'Sangat Baik'], [4, '3–6', 'Baik'], [3, '7–10', 'Cukup'], [2, '11–15', 'Kurang'], [1, '>15', 'Sangat Kurang']])}
          </div>
          <div class="card">
            <h3>B2. RAPI–RESIK–RAWAT–RAJIN–K3 — % pemenuhan</h3>
            ${tb(['Nilai', 'Persentase', 'Kategori'], [[5, '100%', 'Sangat Baik'], [4, '75% – <100%', 'Baik'], [3, '50% – <75%', 'Cukup'], [2, '30% – <50%', 'Kurang'], [1, '<30%', 'Sangat Kurang']])}
          </div>
        </div>
        <div class="grid g2">
          <div class="card">
            <h3>C. Persentase pemenuhan</h3>
            <p><b>= (Jumlah kondisi yang sesuai ÷ Jumlah kondisi yang seharusnya dipenuhi pada area fokus) × 100%</b></p>
            <p style="color:var(--mut)">Mengikuti kondisi dan kebutuhan masing-masing area fokus; tidak menetapkan jumlah titik/objek yang sama untuk setiap line atau area.</p>
          </div>
          <div class="card">
            <h3>D. Nilai akhir = Σ nilai ÷ jumlah pertanyaan</h3>
