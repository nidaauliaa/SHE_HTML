<style>
  :root{--b50:#f3f8fe;--b100:#e6f0fc;--b200:#cfe0f7;--pri:#3f76cc;--pri-d:#2f61b3;--r100:#fdeaea;--r200:#f8d0d2;--r700:#b0404a;--bd:#e3eaf5}

  /* header & sidebar (putih + biru pastel) */

  .hd-ib{color:#4d6086}.hd-ib:hover{color:var(--pri-d)}
  .hd-btn{background:var(--b100);color:#27487f;border:1px solid var(--b200)}.hd-btn:hover{background:var(--b200)}
  .hd-out{background:var(--pri);color:#fff;font-weight:600}.hd-out:hover{background:var(--pri-d)}
  .hd-user{color:#4d6086}
  .sb{background:#fff;border-right:1px solid var(--bd);color:#4d6086}
  .sb-top{border-bottom:1px solid var(--bd)}
  .sb-back{background:var(--b100);color:#27487f;border:1px solid var(--b200)}.sb-back:hover{background:var(--b200)}
  .nv-on{background:var(--b100);color:var(--pri-d);border-left:4px solid var(--pri)}
  .nv-h:hover{background:var(--b50);color:var(--pri-d)}

  .nvc-on{background:var(--b100);color:var(--pri-d)}

  /* komponen kecil (CSS biasa, tidak bergantung Tailwind) */
  .inp{width:100%;font-size:12px;padding:8px 10px;border:1px solid #d3deef;border-radius:8px;background:#fff;color:#334155}
  .inp:focus{outline:3px solid #cfe0f7;outline-offset:0;border-color:#6b9be0}
  .lbl{display:block;font-size:11px;font-weight:600;color:#6b7893;margin-bottom:4px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;transition:.15s;cursor:pointer;white-space:nowrap;border:1px solid transparent}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-p{background:#3f76cc;color:#fff}.btn-p:hover{background:#2f61b3}
  .btn-g{background:#fff;color:#4d6086;border-color:#d3deef}.btn-g:hover{background:#f3f8fe}
  .btn-t{background:#e6f0fc;color:#27487f;border-color:#cfe0f7}.btn-t:hover{background:#cfe0f7}
  .btn-r{background:#fdeaea;color:#b0404a;border-color:#f8d0d2}.btn-r:hover{background:#f8d0d2}
  .btn-x{background:#d9686f;color:#fff}.btn-x:hover{background:#c4545c}
  .ab{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:.15s}
  .ab.v{background:#e6f0fc;color:#2f61b3}.ab.q{background:#eef1fb;color:#4a5fa8}.ab.e{background:#fdf1cf;color:#8a6410}.ab.d{background:#fdeaea;color:#b0404a}.ab:hover{filter:brightness(.95)}
  .bdg{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .bdg.g{background:#dcf3ea;color:#1f7556}.bdg.r{background:#fdeaea;color:#b0404a}.bdg.y{background:#fdf1cf;color:#8a6410}.bdg.b{background:#e6f0fc;color:#2f61b3}.bdg.s{background:#eef2f9;color:#4d6086}
  table.tb{width:100%;font-size:12px;text-align:left;border-collapse:collapse}
  table.tb th{padding:10px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#4d6086;font-weight:700;background:#f3f8fe;border-bottom:1px solid #e3eaf5;white-space:nowrap}
  table.tb td{padding:9px 12px;border-bottom:1px solid #eef3fa;color:#475569;vertical-align:middle}
  table.tb td.nw{white-space:nowrap}
  table.tb tbody tr:hover{background:#f8fbff}
  table.yr th,table.yr td{padding:6px 8px;text-align:center}
  table.yr th:first-child,table.yr td:first-child{text-align:left}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .pop{animation:pop .18s ease-out}
</style>

<script>
/* =====================================================================
   Modul APAR — semua kode dibungkus satu fungsi supaya tidak bentrok dengan
   js/data.js & js/store.js. Fungsi untuk tombol (onclick) ada di objek window.APR.
   Data disimpan di localStorage key "she_apar_v1" (terpisah dari data Patrol 5R).
   ===================================================================== */
(function () {
'use strict';
if (typeof guard === 'function') guard();                 // wajib login (sama seperti halaman lain)
const USER = (typeof me === 'function' && me()) || { nama: 'Admin SHE' };
document.getElementById('uName').textContent = USER.nama;

/* ---------- util ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const iso = (y, m0, d) => `${y}-${pad(m0 + 1)}-${pad(d)}`;
const NOW = new Date(), TODAY = iso(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
const BLN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN3 = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtD = d => { if (!d) return '-'; const [y, m, t] = d.split('-').map(Number); return `${t} ${BLN3[m - 1]} ${y}`; };
const fmtL = d => { const [y, m, t] = d.split('-').map(Number); return `${t} ${BLN[m - 1]} ${y}`; };
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const sum = a => a.reduce((x, y) => x + y, 0);
const toast = (m, t) => { const e = document.createElement('div'); e.className = `pop text-xs font-medium text-white px-4 py-2.5 rounded-lg shadow-lg ${t === 'err' ? 'bg-rose-500' : 'bg-emerald-600'}`; e.textContent = m; $('#toast').appendChild(e); setTimeout(() => e.remove(), 2600); };

/* ---------- data (localStorage) ---------- */
const KEY = 'she_apar_v1';
let db;
function dbLoad() { try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { db = null; } if (!db || db.v !== 1) { db = seed(); dbSave(); } }
function dbSave() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Penyimpanan browser penuh', 'err'); } }

function seed() {
  let s = 20260321; const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const AREAS = [['POS 1 NA',2,0],['Ruang IT',2,0],['POS 7 SECURITY',2,0],['POS APM',3,3],['POS 3 SOKA',1,0],['POS 1 SOKA',1,0],['OFFICE HCGA',2,1],['MARKETING',2,0],['PDC',4,2],['DAPUR TEMPAT MEMASAK',3,1],['RUANG KOMPRESOR',2,0],['MINIBUS BODY',6,4],['GUDANG BODY PART',5,2],['PAINTING BUS',7,5],['INTERIOR',4,3],['KOMPONEN',6,4],['SMALL PRESS',3,1],['WELDING',5,2],['DOJO STAMPING',2,0]];
  const LOK = ['Dekat pintu masuk','Sisi kiri ruangan','Sisi kanan ruangan','Dekat panel listrik','Tengah area','Dekat tangga','Belakang area','Samping pintu keluar'];
  const PETUGAS = ['Budi Santoso','Siti Aminah','Agus Prasetyo','Rina Wulandari'];
  const KET = { i1: ['Tekanan kurang','Tabung berkarat','Tabung penyok'], i2: ['Pin longgar','Pin hilang'], i3: ['Segel putus','Segel tidak ada'], i4: ['Selang retak','Selang getas'], i5: ['Nozzle tersumbat','Nozzle retak'] };
  const d = { v: 1, areas: [], items: [], apars: [], insp: [], pakai: [], vendors: [], needs: [], fin: [] };
  ['Tabung', 'Pin', 'Segel Pin', 'Selang', 'Nozzle'].forEach((n, i) => d.items.push({ id: 'i' + (i + 1), nama: n, active: true }));
  const cy = NOW.getFullYear(), cm = NOW.getMonth(), cd = NOW.getDate();
  let kn = 0;
  AREAS.forEach(([nama, tot, sud], ai) => {
    const aid = 'a' + (ai + 1); d.areas.push({ id: aid, nama });
    for (let k = 0; k < tot; k++) {
      kn++;
      const big = kn % 23 === 0, isi = big ? 'Powder' : pick(['Powder', 'Powder', 'CO2', 'Foam']);
      const off = rnd() < .08 ? -1 - Math.floor(rnd() * 6) : 2 + Math.floor(rnd() * 22), ed = new Date(cy, cm + off, 1 + Math.floor(rnd() * 27));
      const ap = { id: 'p' + kn, kode: pad(kn).padStart(3, '0'), areaId: aid, lokasi: pick(LOK), isi, ukuran: big ? 50 : isi === 'CO2' ? pick([5, 7]) : pick([3, 6, 9]), satuan: 'KG',
        exp: iso(ed.getFullYear(), ed.getMonth(), ed.getDate()), jenis: big ? 'APAB' : 'APAR', catatan: '', active: true };
      d.apars.push(ap);
      // inspeksi: bulan ini (sebanyak "sudah") + 3 bulan sebelumnya
      for (let mo = 0; mo >= -3; mo--) {
        if (mo === 0 ? k >= sud : rnd() > .9) continue;
        const dt = new Date(cy, cm + mo, 1), day = mo === 0 ? 1 + Math.floor(rnd() * cd) : 1 + Math.floor(rnd() * 27);
        const items = d.items.map(it => { const r = rnd(); const nilai = r < .022 ? 'rusak' : r < .03 ? 'tidak ada' : 'baik';
          return { item: it.id, nama: it.nama, nilai, ket: nilai === 'rusak' ? pick(KET[it.id]) : nilai === 'tidak ada' ? 'Komponen tidak ditemukan' : '', foto: '', perbaikan: nilai === 'rusak' ? pick(['sesuai', 'tidak sesuai']) : '' }; });
        d.insp.push({ id: 'n' + d.insp.length, aparId: ap.id, date: iso(dt.getFullYear(), dt.getMonth(), day), petugas: pick(PETUGAS), pakai: rnd() < .03 ? 'sudah' : 'belum', foto: '', items });
      }
    }
  });
  d.vendors = [{ id: 'v1', nama: 'CV Sinar Safety', kontak: '0812-3456-7890' }, { id: 'v2', nama: 'PT Prima Fire Protection', kontak: '021-5550-1234' }, { id: 'v3', nama: 'UD Sumber Api Jaya', kontak: '0813-9876-5432' }];
  d.needs = ['Refill Powder', 'Ganti Selang', 'Ganti Segel Pin', 'Beli APAR Baru', 'Ganti Nozzle'].map((n, i) => ({ id: 'k' + (i + 1), nama: n }));
  for (let i = 0; i < 8; i++) d.fin.push({ id: 'f' + i, aparId: pick(d.apars).id, vendorId: pick(d.vendors).id, needId: pick(d.needs).id, tgl: iso(cy, Math.floor(rnd() * (cm + 1)), 1 + Math.floor(rnd() * 27)), biaya: pick([85000, 150000, 275000, 450000, 1250000]) });
  ['Kebakaran kecil di area welding', 'Pelatihan K3 / simulasi', 'Percikan api panel listrik', 'Kebocoran gas ringan', 'Simulasi evakuasi'].forEach((al, i) => {
    const ap = pick(d.apars), dt = new Date(cy, cm - Math.floor(rnd() * 5), 1 + Math.floor(rnd() * 27));
    d.pakai.push({ id: 'u' + i, aparId: ap.id, petugas: pick(PETUGAS), tgl: iso(dt.getFullYear(), dt.getMonth(), dt.getDate()), alasan: al, status: i % 2 ? 'Sudah Refill' : 'Belum Refill' });
  });
  return d;
}

/* ---------- lookup ---------- */
const byId = (arr, id) => arr.find(x => x.id === id);
const areaNm = id => (byId(db.areas, id) || {}).nama || '-';
const apar = id => byId(db.apars, id);
const lokasi = a => a ? areaNm(a.areaId) + (a.lokasi ? ' - ' + a.lokasi : '') : '-';
const isGood = i => i.items.every(x => x.nilai !== 'rusak');   // status inspeksi: Good bila tidak ada item rusak
const isExp = a => a.active && a.exp && a.exp < TODAY;
const inspStat = i => isGood(i) ? '<span class="bdg g">Good</span>' : '<span class="bdg r">Not Good</span>';
const opts = (arr, sel, ph) => (ph != null ? `<option value="">${ph}</option>` : '') + arr.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(sel) ? ' selected' : ''}>${esc(l)}</option>`).join('');
const areaOpts = (sel, ph) => opts(db.areas.map(a => [a.id, a.nama]), sel, ph);
const years = () => { const y = NOW.getFullYear(), set = new Set([y - 2, y - 1, y, y + 1]); db.insp.forEach(i => set.add(+i.date.slice(0, 4))); db.fin.forEach(f => set.add(+f.tgl.slice(0, 4))); return [...set].sort(); };

/* ---------- export Excel (.xlsx asli, pakai js/xlsx-lite.js) ---------- */
function exportX(name, head, rows) {
  if (typeof XL === 'undefined') return toast('xlsx-lite.js belum dimuat', 'err');
  XL.download(name + '.xlsx', [{ name: 'Data', rows: [head.map(h => ({ v: h, s: 1 })), ...rows] }]);
}

/* ---------- modal & dialog ---------- */
function openM(html, w) {
  const m = $('#modal'); m.innerHTML = `<div class="pop bg-white rounded-xl shadow-xl w-full ${w || 'max-w-lg'} max-h-[92vh] flex flex-col overflow-hidden">${html}</div>`;
  m.classList.remove('hidden'); m.classList.add('flex'); document.body.style.overflow = 'hidden';
}
function closeM() { const m = $('#modal'); m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; document.body.style.overflow = ''; }
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeM(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });
const mHead = (t, sub) => `<div class="bg-[#e6f0fc] text-slate-800 border-b border-[#cfe0f7] px-5 py-3.5 flex items-center justify-between flex-shrink-0"><div><h3 class="font-bold text-sm tracking-wide">${t}</h3>${sub ? `<p class="text-[11px] text-slate-500 mt-0.5">${sub}</p>` : ''}</div><button onclick="APR.close()" class="text-slate-500 hover:text-slate-800 text-base"><i class="fa-solid fa-xmark"></i></button></div>`;

// form generik: fields = [{k,l,t:'text|number|date|select|textarea|check',o:[[v,l]],req,ph,full}]
let FORM = null;
function formM(title, fields, vals, onSave) {
  FORM = { fields, onSave };
  const inp = f => {
    const v = vals[f.k] == null ? '' : vals[f.k], id = 'ff_' + f.k;
    if (f.t === 'select') return `<select id="${id}" class="inp">${opts(f.o, v, f.ph)}</select>`;
    if (f.t === 'textarea') return `<textarea id="${id}" rows="3" class="inp" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
    if (f.t === 'check') return `<label class="flex items-center gap-2 text-xs text-slate-600 pt-2"><input type="checkbox" id="${id}" ${v ? 'checked' : ''} class="w-4 h-4"> ${esc(f.ph || 'Aktif')}</label>`;
    return `<input id="${id}" type="${f.t || 'text'}" ${f.t === 'number' ? 'step="any" min="0"' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}" class="inp">`;
  };
  openM(mHead(title) + `<div class="p-5 overflow-y-auto"><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${fields.map(f => `<div class="${f.full ? 'sm:col-span-2' : ''}"><label class="lbl">${f.l}${f.req ? ' <span class="text-rose-500">*</span>' : ''}</label>${inp(f)}</div>`).join('')}</div>
    <p id="ffErr" class="text-xs text-rose-600 mt-3 hidden"></p>
    <div class="flex justify-end gap-2 mt-5"><button class="btn btn-g" onclick="APR.close()">Batal</button><button class="btn btn-p" onclick="APR.submit()"><i class="fa-solid fa-floppy-disk"></i> Simpan</button></div></div>`);
  const first = $('#modal input,#modal select'); if (first) first.focus();
}
function confirmM(msg, onOk, label) {
  FORM = { onOk };
  openM(mHead('Konfirmasi') + `<div class="p-5"><p class="text-sm text-slate-600 leading-relaxed">${msg}</p><div class="flex justify-end gap-2 mt-5"><button class="btn btn-g" onclick="APR.close()">Batal</button><button class="btn btn-x" onclick="APR.ok()"><i class="fa-solid fa-trash"></i> ${label || 'Hapus'}</button></div></div>`, 'max-w-md');
}

/* ---------- tabel generik: cari/filter → gambar ulang hanya tabelnya, dengan paging ---------- */
const TB = {}, PG = {}, FL = {};
const fl = id => FL[id] || (FL[id] = {});
function tbl(id, cols, get, sumFn) { TB[id] = { cols, get, sumFn }; PG[id] = PG[id] || { p: 1, s: 10 }; return `<div id="tb_${id}">${tbHtml(id)}</div>`; }
function tbHtml(id) {
  const { cols, get } = TB[id], all = get(), pg = PG[id], n = all.length, pages = Math.max(1, Math.ceil(n / pg.s));
  if (pg.p > pages) pg.p = pages;

/* ---- LAPORAN: BELUM INSPEKSI ---- */
const getBelum = () => { const { m, y } = ST.belum, pre = `${y}-${pad(m + 1)}`, done = new Set(db.insp.filter(i => i.date.slice(0, 7) === pre).map(i => i.aparId));
  return db.apars.filter(a => a.active && !done.has(a.id)).sort((a, b) => a.kode.localeCompare(b.kode, undefined, { numeric: true })); };
const sumBelum = l => `Total APAR yang belum diinspeksi bulan <b>${BLN[ST.belum.m]}</b> tahun <b>${ST.belum.y}</b> : <span class="text-rose-600 text-lg font-extrabold ml-1">${l.length}</span>`;
function pBelum() {
  view.innerHTML = head('Belum Inspeksi', 'APAR aktif yang belum diperiksa pada periode terpilih')
    + card(`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4 items-end">${fld('Bulan', `<select class="inp" onchange="APR.belumF('m',this.value)">${opts(BLN.map((b, i) => [i, b]), ST.belum.m)}</select>`)}${fld('Tahun', `<select class="inp" onchange="APR.belumF('y',this.value)">${opts(years().map(y => [y, y]), ST.belum.y)}</select>`)}</div>
      <div id="sum_belum" class="mb-4 text-sm text-slate-600 bg-amber-50 border border-amber-200 rounded-lg px-4 py-3">${sumBelum(getBelum())}</div>`
      + tbl('belum', [ncol, { h: 'Kode APAR', c: a => `<b class="text-slate-700">${esc(a.kode)}</b>` }, { h: 'Lokasi', c: a => esc(lokasi(a)) }, { h: 'Jenis', c: a => esc(a.isi) }], getBelum, sumBelum));

function yearlyOut() {
  const Y = ST.yearly, a = db.apars.find(x => x.kode.toLowerCase() === Y.kode.trim().toLowerCase()), out = $('#yOut');
  if (!a) { out.innerHTML = card(`<p class="text-sm text-rose-600"><i class="fa-solid fa-circle-exclamation"></i> APAR dengan kode <b>${esc(Y.kode)}</b> tidak ditemukan.</p>`); return; }
  const mon = Array.from({ length: 12 }, (_, m) => db.insp.filter(i => i.aparId === a.id && i.date.slice(0, 7) === `${Y.y}-${pad(m + 1)}`).sort((p, q) => q.date.localeCompare(p.date))[0]);   // inspeksi terakhir tiap bulan
  const cell = (ins, itemId) => { if (!ins) return '<span class="text-slate-300">·</span>'; const r = ins.items.find(x => x.item === itemId); if (!r) return '<span class="text-slate-300">·</span>';
    return r.nilai === 'baik' ? '<b class="text-emerald-600">B</b>' : r.nilai === 'rusak' ? '<b class="text-rose-600">R</b>' : '<b class="text-slate-500">T/A</b>'; };
  const rem = itemId => mon.map((ins, m) => { const r = ins && ins.items.find(x => x.item === itemId); return r && r.ket ? `${BLN3[m]}: ${r.ket}` : ''; }).filter(Boolean).join('; ');
  const it = db.items.filter(x => x.active), row = (l, v) => `<tr><td class="!py-0.5 !pr-4 text-slate-500 whitespace-nowrap">${l}</td><td class="!py-0.5">: <b class="text-slate-700">${v}</b></td></tr>`;
  out.innerHTML = card(`<h3 class="text-center text-base md:text-lg font-bold text-slate-800 mb-4">Inspeksi Tahunan ${a.jenis}</h3>
    <table class="mb-4 text-sm"><tbody>${row('Tahun', Y.y)}${row('Kode', esc(a.kode))}${row('Pemadam', a.jenis)}${row('Jenis', esc(a.isi))}${row('Ukuran', `${a.ukuran} ${esc(a.satuan)}`)}${row('Lokasi', esc(lokasi(a)))}</tbody></table>
    <div class="overflow-x-auto rounded-lg border border-slate-200"><table class="tb yr"><thead><tr><th>Item Check</th>${Array.from({ length: 12 }, (_, i) => `<th>${i + 1}</th>`).join('')}<th>Remaks</th></tr></thead><tbody>
    ${it.map(x => `<tr><td class="font-semibold text-slate-700 nw">${esc(x.nama)}</td>${mon.map(m => `<td>${cell(m, x.id)}</td>`).join('')}<td class="!text-left text-[11px] min-w-[180px]">${esc(rem(x.id)) || '<span class="text-slate-300">-</span>'}</td></tr>`).join('') || '<tr><td colspan="14" class="!py-8 text-center text-slate-400">Belum ada item check aktif</td></tr>'}</tbody></table></div>
    <p class="text-[11px] text-slate-500 mt-3"><b class="text-emerald-600">B</b> = Baik &nbsp; <b class="text-rose-600">R</b> = Rusak &nbsp; <b>T/A</b> = Tidak Ada &nbsp; · = belum diinspeksi</p>`);
}

];

const open = new Set();
const cur = () => { const h = location.hash.replace(/^#\/?/, ''); return PAGES[h] ? h : 'dashboard'; };

function nav() {
  const c = cur(); MENU.forEach(m => { if (m.ch && m.ch.some(x => x[0] === c)) open.add(m.g); });
  $('#nav').innerHTML = MENU.map(m => {
    if (m.sec) return `<p class="px-3 pt-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider">${m.sec}</p>`;
    if (!m.ch) return `<a href="#${m.id}" class="flex items-center gap-3 px-3 py-2.5 rounded-md transition ${c === m.id ? 'nv-on font-medium' : 'nv-h'}"><i class="fa-solid ${m.i} w-4 text-center ${c === m.id ? 'nv-ic-on' : 'text-slate-400'}"></i><span>${m.t}</span></a>`;
    const o = open.has(m.g);
    return `<div><button onclick="APR.grp('${m.g}')" class="nv-h w-full flex items-center justify-between px-3 py-2 rounded-md transition"><div class="flex items-center gap-3"><i class="fa-solid ${m.i} w-4 text-center text-slate-400"></i><span>${m.t}</span></div><i class="fa-solid fa-chevron-right text-[10px] transition-transform duration-200 ${o ? 'rotate-90' : ''}"></i></button>
      <div class="${o ? '' : 'hidden'} pl-9 pr-2 py-1 space-y-1 nvg rounded-md my-1">${m.ch.map(([id, t]) => `<a href="#${id}" class="block py-1.5 px-2 rounded transition ${c === id ? 'nvc-on font-medium' : 'nvc-h'}">${t}</a>`).join('')}</div></div>`;
  }).join('');
}
function render() {
  charts.forEach(x => x.destroy()); charts = [];
  nav(); PAGES[cur()](); window.scrollTo(0, 0);

}

let deb;
window.APR = {
  close: closeM, grp: g => { open.has(g) ? open.delete(g) : open.add(g); nav(); },
  pg: (id, d) => { PG[id].p += d; tbDraw(id); }, ps: (id, s) => { PG[id].s = +s; PG[id].p = 1; tbDraw(id); },
  f: (id, k, v) => { fl(id)[k] = v; PG[id].p = 1; tbDraw(id); },
  fs: (id, v) => { clearTimeout(deb); deb = setTimeout(() => { fl(id).q = v; PG[id].p = 1; tbDraw(id); }, 150); },
  submit: () => {                                          // simpan form generik
    const v = {}; let bad = '';
    FORM.fields.forEach(f => { const e = $('#ff_' + f.k); v[f.k] = f.t === 'check' ? e.checked : (e.value || '').trim(); if (f.req && !v[f.k] && !bad) bad = `${f.l} wajib diisi.`; });
    if (!bad) bad = FORM.onSave(v);
    if (bad) { const e = $('#ffErr'); e.textContent = bad; e.classList.remove('hidden'); return; }
    closeM();
  },
  ok: () => FORM.onOk(),
  aparForm, aparDel, qr, qrDl, qrPrint, itemForm, itemDel, areaForm, areaDel, vendorForm, vendorDel, needForm, needDel, finForm, finDel,
  view: viewInsp, exp: k => EXPORTS[k](),
  dashFilter: () => { const s = $('#dS').value, e = $('#dE').value; if (!s || !e) return toast('Isi bulan mulai & selesai', 'err'); if (s > e) return toast('Bulan mulai tidak boleh melewati bulan selesai', 'err'); ST.dash = { s, e }; render(); },
  dashReset: () => { ST.dash = { s: TODAY.slice(0, 7), e: TODAY.slice(0, 7) }; render(); },
  belumF: (k, v) => { ST.belum[k] = +v; PG.belum.p = 1; tbDraw('belum'); },
  yearlyGo: () => { ST.yearly = { y: +$('#yY').value, kode: $('#yK').value, run: true }; if (!ST.yearly.kode.trim()) return toast('Isi kode APAR', 'err'); yearlyOut(); }
};

dbLoad();
render();
})();
</script>
</body>
